        function toggleThemeSetting() {
            data.settings.darkMode = !data.settings.darkMode;
            saveData();
            applyTheme();
            renderSettings();
            renderDashboard();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `جمعيتي_بيانات_${todayStr()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('تم تصدير البيانات', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.associations && imported.settings) {
                        confirmAction('سيتم استبدال البيانات الحالية. هل أنت متأكد؟', () => {
                            data = imported;
                            if (!data.nextId) data.nextId = 1;
                            saveData();
                            applyTheme();
                            renderDashboard();
                            showToast('تم استيراد البيانات', 'success');
                        });
                    } else {
                        showToast('ملف غير صالح', 'error');
                    }
                } catch (err) {
                    showToast('خطأ في قراءة الملف', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function clearAllData() {
            confirmAction('⚠️ هل أنت متأكد من مسح جميع البيانات؟ لا يمكن التراجع.', () => {
                data = getDefaultData();
                saveData();
                applyTheme();
                renderDashboard();
                showToast('تم مسح جميع البيانات', 'warning');
            });
        }

        // ======================================================================
        //  INIT
        // ======================================================================
        function init() {
            const now = new Date();
            document.getElementById('navbarDate').textContent = now.toLocaleDateString('ar-EG', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
            applyTheme();
            renderDashboard();
            if (data.associations.length === 0) createDemoData();
            setInterval(() => { renderDashboard(); }, 60000);
        }

        function createDemoData() {
            const demoMembers = ['أحمد محمد', 'سارة علي', 'خالد حسن', 'منى إبراهيم', 'يوسف سعيد'];
            const startDate = '2026-01-01';
            const months = 10;
            const totalValue = 10000;
            const membersCount = 5;
            const monthlyPayment = 1000;

            const members = demoMembers.map(name => ({ id: genId(), name, payments: [], notes: '' }));
            const monthSeq = getMonthSequence(startDate, months);
            const monthsData = monthSeq.map((m) => ({ ...m, status: 'pending' }));

            // دفعة تجريبية على أول شهر لاثنين من الأعضاء
            members[0].payments.push({ month: monthSeq[0].key, paid: true, amount: 1000, method: 'نقدي', date: '2026-01-15', time: '10:00', note: '' });
            members[1].payments.push({ month: monthSeq[0].key, paid: true, amount: 500, method: 'Vodafone Cash', date: '2026-01-20', time: '11:00', note: 'دفعة جزئية' });

            const assoc = {
                id: genId(),
                name: 'جمعية الأصدقاء',
                totalValue, startDate,
                endDate: addMonths(startDate, months - 1),
                totalMonths: months, monthlyPayment, members,
                months: monthsData,
                collectionOrder: members.map(m => m.id),
                status: 'active',
                notes: 'جمعية تجريبية',
                createdAt: new Date().toISOString()
            };
            data.associations.push(assoc);
            saveData();
            addNotification('info', '📌 تم إنشاء بيانات تجريبية');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
