<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جمعيتي – إدارة الجمعيات المالية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        :root {
            --bg-main: #f5f7fa;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.25s ease;
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --primary-dark: #1d4ed8;
            --success: #22c55e;
            --success-light: #dcfce7;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --orange: #f97316;
            --orange-light: #ffedd5;
            --gray: #94a3b8;
            --gray-light: #f1f5f9;
            --font: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            --header-height: 68px;
        }
        [data-theme="dark"] {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #334155;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.6);
            --gray-light: #1e293b;
            --primary-light: #1e3a5f;
            --success-light: #064e3b;
            --warning-light: #78350f;
            --danger-light: #7f1d1d;
            --info-light: #1e3a5f;
            --orange-light: #7c2d12;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-main); color:var(--text-primary); transition:background var(--transition), color var(--transition); min-height:100vh; line-height:1.6; }
        a { text-decoration:none; color:inherit; }
        button { cursor:pointer; font-family:inherit; border:none; background:none; color:inherit; }
        input, select, textarea { font-family:inherit; font-size:1rem; background:var(--bg-main); border:1.5px solid var(--border-color); color:var(--text-primary); border-radius:var(--radius-sm); padding:10px 14px; width:100%; transition:border var(--transition), box-shadow var(--transition); outline:none; }
        input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.15); }
        textarea { resize:vertical; min-height:60px; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:var(--bg-main); }
        ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }
        .container { max-width:1320px; margin:0 auto; padding:0 16px; }
        .flex { display:flex; align-items:center; gap:12px; }
        .flex-wrap { flex-wrap:wrap; }
        .flex-between { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
        .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
        .text-center { text-align:center; }
        .text-muted { color:var(--text-muted); }
        .text-sm { font-size:0.85rem; }
        .text-xs { font-size:0.72rem; }
        .fw-bold { font-weight:700; }
        .mt-1 { margin-top:8px; }
        .mt-2 { margin-top:16px; }
        .mt-3 { margin-top:24px; }
        .mb-1 { margin-bottom:8px; }
        .mb-2 { margin-bottom:16px; }
        .gap-1 { gap:8px; }
        .gap-2 { gap:16px; }
        .hidden { display:none !important; }
        .w-full { width:100%; }
        .relative { position:relative; }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 20px; border-radius:var(--radius-sm); font-weight:600; font-size:0.95rem; transition:background var(--transition), transform 0.15s, box-shadow var(--transition); border:none; cursor:pointer; white-space:nowrap; }
        .btn:active { transform:scale(0.97); }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:var(--primary-dark); box-shadow:0 4px 16px rgba(37,99,235,0.3); }
        .btn-success { background:var(--success); color:#fff; }
        .btn-success:hover { background:#16a34a; box-shadow:0 4px 16px rgba(34,197,94,0.3); }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-danger:hover { background:#dc2626; box-shadow:0 4px 16px rgba(239,68,68,0.3); }
        .btn-warning { background:var(--warning); color:#fff; }
        .btn-warning:hover { background:#d97706; box-shadow:0 4px 16px rgba(245,158,11,0.3); }
        .btn-outline { background:transparent; border:1.5px solid var(--border-color); color:var(--text-secondary); }
        .btn-outline:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
        .btn-ghost { background:var(--gray-light); color:var(--text-secondary); }
        .btn-ghost:hover { background:var(--border-color); }
        .btn-sm { padding:6px 14px; font-size:0.82rem; border-radius:var(--radius-xs); }
        .btn-icon { width:40px; height:40px; padding:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:1.1rem; }
        .card { background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 24px; transition:background var(--transition), box-shadow var(--transition), transform 0.2s; border:1px solid var(--border-color); }
        .card:hover { box-shadow:var(--shadow-hover); }
        .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; font-weight:600; font-size:1.1rem; }
        .navbar { position:sticky; top:0; z-index:100; background:var(--bg-card); border-bottom:1px solid var(--border-color); padding:0 16px; height:var(--header-height); display:flex; align-items:center; justify-content:space-between; backdrop-filter:blur(12px); }
        .navbar-brand { font-size:1.3rem; font-weight:800; color:var(--primary); display:flex; align-items:center; gap:8px; }
        .navbar-brand i { font-size:1.5rem; }
        .navbar-actions { display:flex; align-items:center; gap:6px; }
        .navbar-actions .btn-icon { width:40px; height:40px; border-radius:50%; background:var(--gray-light); color:var(--text-secondary); position:relative; }
        .navbar-actions .btn-icon:hover { background:var(--border-color); }
        .badge-dot { position:absolute; top:2px; right:2px; width:18px; height:18px; background:var(--danger); color:#fff; border-radius:50%; font-size:0.6rem; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg-card); }
        .navbar-date { font-size:0.85rem; color:var(--text-muted); margin-left:8px; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:14px; margin-bottom:24px; }
        .stat-card { background:var(--bg-card); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); border:1px solid var(--border-color); transition:all var(--transition); display:flex; align-items:center; gap:14px; }
        .stat-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-hover); }
        .stat-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
        .stat-icon.blue { background:var(--primary-light); color:var(--primary); }
        .stat-icon.green { background:var(--success-light); color:var(--success); }
        .stat-icon.yellow { background:var(--warning-light); color:var(--warning); }
        .stat-icon.red { background:var(--danger-light); color:var(--danger); }
        .stat-icon.orange { background:var(--orange-light); color:var(--orange); }
        .stat-icon.gray { background:var(--gray-light); color:var(--text-muted); }
        .stat-info { flex:1; min-width:0; }
        .stat-info .number { font-size:1.6rem; font-weight:800; line-height:1.2; letter-spacing:-0.5px; }
        .stat-info .label { font-size:0.78rem; color:var(--text-muted); font-weight:500; }
        .section-title { font-size:1.25rem; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
        .section-title i { color:var(--primary); }
        .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); border:1px solid var(--border-color); background:var(--bg-card); }
        table { width:100%; border-collapse:collapse; font-size:0.9rem; min-width:600px; }
        table th { background:var(--gray-light); color:var(--text-secondary); font-weight:600; padding:12px 14px; text-align:right; border-bottom:2px solid var(--border-color); font-size:0.8rem; }
        table td { padding:12px 14px; border-bottom:1px solid var(--border-color); vertical-align:middle; }
        table tr:last-child td { border-bottom:none; }
        table tr:hover td { background:var(--gray-light); }
        .badge { display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:999px; font-size:0.75rem; font-weight:600; white-space:nowrap; }
        .badge-success { background:var(--success-light); color:#16a34a; }
        .badge-warning { background:var(--warning-light); color:#d97706; }
        .badge-danger { background:var(--danger-light); color:#dc2626; }
        .badge-info { background:var(--info-light); color:var(--info); }
        .badge-gray { background:var(--gray-light); color:var(--text-muted); }
        .badge-orange { background:var(--orange-light); color:var(--orange); }
        .progress-wrap { background:var(--gray-light); border-radius:999px; height:8px; overflow:hidden; width:100%; margin-top:6px; }
        .progress-bar { height:100%; border-radius:999px; background:var(--primary); transition:width 0.5s ease; }
        .progress-bar.green { background:var(--success); }
        .progress-bar.yellow { background:var(--warning); }
        .progress-bar.red { background:var(--danger); }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); backdrop-filter:blur(4px); z-index:999; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity 0.3s ease; }
        .modal-overlay.active { opacity:1; pointer-events:auto; }
        .modal { background:var(--bg-card); border-radius:var(--radius); max-width:560px; width:100%; max-height:90vh; overflow-y:auto; padding:28px 32px; box-shadow:0 24px 64px rgba(0,0,0,0.2); transform:scale(0.95) translateY(10px); transition:transform 0.3s ease; border:1px solid var(--border-color); }
        .modal-overlay.active .modal { transform:scale(1) translateY(0); }
        .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
        .modal-header h2 { font-size:1.3rem; font-weight:700; }
        .modal-close { width:36px; height:36px; border-radius:50%; background:var(--gray-light); display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
        .modal-close:hover { background:var(--border-color); }
        .modal .form-group { margin-bottom:16px; }
        .modal .form-group label { display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px; color:var(--text-secondary); }
        .modal .form-group .hint { font-size:0.78rem; color:var(--text-muted); margin-top:6px; padding:8px 12px; background:var(--gray-light); border-radius:var(--radius-xs); line-height:1.7; }
        .modal .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .modal-actions { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
        .modal-actions .btn { flex:1; min-width:100px; }
        .toast-container { position:fixed; top:80px; left:16px; z-index:2000; display:flex; flex-direction:column; gap:10px; max-width:380px; width:100%; }
        .toast { background:var(--bg-card); border-radius:var(--radius-sm); padding:14px 18px; box-shadow:var(--shadow-hover); border-right:4px solid var(--primary); display:flex; align-items:center; gap:12px; animation:slideIn 0.35s ease; border:1px solid var(--border-color); }
        .toast.success { border-right-color:var(--success); }
        .toast.error { border-right-color:var(--danger); }
        .toast.warning { border-right-color:var(--warning); }
        .toast.info { border-right-color:var(--info); }
        .toast i { font-size:1.3rem; flex-shrink:0; }
        .toast .toast-msg { flex:1; font-size:0.9rem; }
        .toast .toast-close { cursor:pointer; font-size:1.1rem; color:var(--text-muted); padding:0 4px; }
        @keyframes slideIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
        .assoc-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:18px; }
        .assoc-card { background:var(--bg-card); border-radius:var(--radius); padding:20px 22px; border:1px solid var(--border-color); box-shadow:var(--shadow); transition:all var(--transition); cursor:pointer; }
        .assoc-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); }
        .assoc-card .name { font-size:1.15rem; font-weight:700; }
        .assoc-card .meta { display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:8px; font-size:0.82rem; color:var(--text-secondary); }
        .assoc-card .meta span { display:flex; align-items:center; gap:4px; }
        .assoc-card .actions { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
        @media (max-width:992px) { .grid-4 { grid-template-columns:repeat(2,1fr); } .grid-3 { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:768px) { .grid-2 { grid-template-columns:1fr; } .grid-3 { grid-template-columns:1fr 1fr; } .grid-4 { grid-template-columns:1fr 1fr; } .stats-grid { grid-template-columns:repeat(2,1fr); } .modal { padding:20px 16px; margin:10px; } .modal .form-row { grid-template-columns:1fr; } .navbar-brand { font-size:1.05rem; } .navbar-date { font-size:0.7rem; } .assoc-grid { grid-template-columns:1fr; } .stat-card { padding:14px 16px; } .stat-info .number { font-size:1.3rem; } .stat-icon { width:40px; height:40px; font-size:1.1rem; } .toast-container { left:8px; right:8px; max-width:100%; top:72px; } .card { padding:16px; } .section-title { font-size:1.05rem; } .modal-actions .btn { flex:1 1 100%; } table { font-size:0.8rem; min-width:480px; } table th, table td { padding:8px 10px; } .navbar-actions .btn-icon { width:36px; height:36px; font-size:0.95rem; } }
        @media (max-width:480px) { .stats-grid { grid-template-columns:1fr 1fr; gap:10px; } .grid-3 { grid-template-columns:1fr; } .stat-card { padding:12px; gap:10px; } .stat-info .number { font-size:1.1rem; } .stat-info .label { font-size:0.65rem; } .stat-icon { width:34px; height:34px; font-size:0.9rem; } .container { padding:0 10px; } .btn { padding:8px 14px; font-size:0.82rem; } .btn-sm { padding:4px 10px; font-size:0.7rem; } .navbar { padding:0 10px; height:60px; } .navbar-brand { font-size:0.95rem; } }
        .page { display:none; animation:fadeUp 0.3s ease; }
        .page.active { display:block; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .month-tracker { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
        .month-chip { padding:6px 16px; border-radius:999px; font-size:0.8rem; font-weight:600; background:var(--gray-light); color:var(--text-muted); border:1px solid var(--border-color); cursor:pointer; transition:all var(--transition); }
        .month-chip.done { background:var(--success-light); color:#16a34a; border-color:var(--success); }
        .month-chip.current { background:var(--primary-light); color:var(--primary); border-color:var(--primary); }
        .month-chip.upcoming { opacity:0.5; }
        .month-chip.partial { background:var(--warning-light); color:#d97706; border-color:var(--warning); }
        .report-stat { text-align:center; padding:16px; background:var(--gray-light); border-radius:var(--radius-sm); }
        .report-stat .num { font-size:1.8rem; font-weight:800; }
        .report-stat .lbl { font-size:0.8rem; color:var(--text-muted); }
        .setting-item { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border-color); gap:12px; flex-wrap:wrap; }
        .setting-item:last-child { border-bottom:none; }
        .setting-item .left { display:flex; align-items:center; gap:12px; }
        .setting-item .left i { width:28px; color:var(--text-muted); }
        .toggle { width:44px; height:24px; background:var(--border-color); border-radius:999px; position:relative; cursor:pointer; transition:background var(--transition); flex-shrink:0; }
        .toggle.active { background:var(--primary); }
        .toggle::after { content:''; position:absolute; top:2px; right:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:transform var(--transition); box-shadow:0 1px 4px rgba(0,0,0,0.2); }
        .toggle.active::after { transform:translateX(-20px); }
        .empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); }
        .empty-state i { font-size:3rem; margin-bottom:12px; opacity:0.4; }
        .empty-state h3 { font-size:1.1rem; color:var(--text-secondary); }
        .divider { border:none; border-top:1px solid var(--border-color); margin:20px 0; }
        .detail-header { background:var(--bg-card); border-radius:var(--radius); padding:20px 24px; margin-bottom:20px; border:1px solid var(--border-color); box-shadow:var(--shadow); }
        .detail-header .name { font-size:1.6rem; font-weight:800; }
        .detail-meta { display:flex; flex-wrap:wrap; gap:16px 28px; margin-top:8px; font-size:0.9rem; color:var(--text-secondary); }
        .detail-meta span { display:flex; align-items:center; gap:5px; }
        .detail-meta i { color:var(--text-muted); width:18px; }
        .ledger-row { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--border-color); font-size:0.9rem; gap:8px; flex-wrap:wrap; }
        .ledger-row:last-child { border-bottom:none; }
        .ledger-row .label { font-weight:600; min-width:120px; }
        @media (max-width:640px) { .table-wrap table { min-width:100%; } .table-wrap table thead { display:none; } .table-wrap table tbody tr { display:block; padding:12px 0; border-bottom:2px solid var(--border-color); } .table-wrap table tbody tr:last-child { border-bottom:none; } .table-wrap table tbody td { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-bottom:none; gap:8px; flex-wrap:wrap; } .table-wrap table tbody td::before { content:attr(data-label); font-weight:600; font-size:0.75rem; color:var(--text-muted); flex-shrink:0; } .table-wrap table tbody td:last-child { border-bottom:none; } }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="flex">
            <div class="navbar-brand">
                <i class="fas fa-hand-holding-usd"></i>
                <span>جمعيتي</span>
            </div>
            <span class="navbar-date" id="navbarDate"></span>
        </div>
        <div class="navbar-actions">
            <button class="btn-icon" onclick="toggleTheme()" title="الوضع الليلي">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <button class="btn-icon relative" onclick="toggleNotifications()" title="الإشعارات">
                <i class="fas fa-bell"></i>
                <span class="badge-dot" id="notifBadge" style="display:none;">0</span>
            </button>
            <button class="btn-icon" onclick="navigateTo('settings')" title="الإعدادات">
                <i class="fas fa-cog"></i>
            </button>
            <button class="btn btn-primary btn-sm" onclick="openAddAssociation()">
                <i class="fas fa-plus"></i> جمعية جديدة
            </button>
        </div>
    </nav>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container" style="padding-top:20px;padding-bottom:40px;">

        <div class="page active" id="page-dashboard">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="card mb-2" style="background:var(--primary-light);border-color:var(--primary);">
                <div class="flex-between">
                    <div class="flex gap-1">
                        <i class="fas fa-bullhorn" style="color:var(--primary);font-size:1.2rem;"></i>
                        <span style="font-weight:600;">ما الذي يحتاج إلى متابعة؟</span>
                    </div>
                    <span id="quickSummary" style="font-size:0.9rem;color:var(--text-secondary);">لا توجد تنبيهات</span>
                </div>
            </div>
            <div class="card mb-2">
                <div class="card-header">
                    <span><i class="fas fa-trophy" style="color:var(--warning);"></i> ترتيب القبض</span>
                    <span class="text-sm text-muted">المستحق لهذا الشهر</span>
                </div>
                <div id="collectionQueue"></div>
            </div>
            <div class="flex-between mb-1">
                <div class="section-title"><i class="fas fa-users"></i> الجمعيات</div>
                <div class="flex gap-1">
                    <button class="btn btn-sm btn-ghost" onclick="openAddAssociation()"><i class="fas fa-plus"></i> إضافة</button>
                </div>
            </div>
            <div class="assoc-grid" id="assocGrid"></div>
        </div>

        <div class="page" id="page-detail">
            <button class="btn btn-ghost btn-sm mb-2" onclick="navigateTo('dashboard')">
                <i class="fas fa-arrow-right"></i> العودة للرئيسية
            </button>
            <div id="detailContent"></div>
        </div>

        <div class="page" id="page-reports">
            <div class="flex-between mb-2">
                <div class="section-title"><i class="fas fa-chart-pie"></i> التقارير</div>
                <button class="btn btn-sm btn-ghost" onclick="navigateTo('dashboard')"><i class="fas fa-arrow-right"></i> رجوع</button>
            </div>
            <div id="reportsContent"></div>
        </div>

            <div class="flex-between mb-2">

    <script>
        // ======================================================================
        //  DATA LAYER
        // ======================================================================
        const STORAGE_KEY = 'jam3yati_data';

        function getDefaultData() {
            return {
                associations: [],
                settings: {
                    appName: 'جمعيتي',
                    currency: 'جنيه مصري',
                    darkMode: false,
                    notifications: { delay: true, completion: true, preCollection: true }
                },
                notifications: [],
                nextId: 1
            };
        }

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (!parsed.settings) parsed.settings = getDefaultData().settings;
                    if (!parsed.notifications) parsed.notifications = [];
                    if (!parsed.nextId) parsed.nextId = 1;
                    if (!parsed.associations) parsed.associations = [];
                    // ضمان أن كل عضو لديه مصفوفة payments
                    parsed.associations.forEach(a => {
                        if (!Array.isArray(a.members)) a.members = [];
                        a.members.forEach(m => {
                            if (!Array.isArray(m.payments)) {
                                if (m.payments && typeof m.payments === 'object') {
                                    m.payments = [m.payments];
                                } else {
                                    m.payments = [];
                                }
                            }
                        });
                    });
                    return parsed;
                }
            } catch (e) { console.warn('Load data error', e); }
            return getDefaultData();
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) { console.warn('Save error', e); }
        }

        function genId() { return data.nextId++; }

        // ======================================================================
        //  HELPERS
        // ======================================================================
        function formatCurrency(amount) {
            const n = Number(amount) || 0;
            return n.toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + ' ' + data.settings.currency;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function monthLabel(year, month) {
            const d = new Date(year, month - 1, 1);
            return d.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
        }

        function monthKeyFn(year, month) {
            return year + '-' + String(month).padStart(2, '0');
        }

        function getMonthFromKey(key) {
            const parts = key.split('-');
            return { year: parseInt(parts[0]), month: parseInt(parts[1]) };
        }

        function getCurrentMonth() {
            const d = new Date();
            return { year: d.getFullYear(), month: d.getMonth() + 1 };
        }

        function addMonths(dateStr, count) {
            const d = new Date(dateStr + 'T00:00:00');
            d.setMonth(d.getMonth() + count);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function getMonthSequence(startDate, totalMonths) {
            const result = [];
            const d = new Date(startDate + 'T00:00:00');
            for (let i = 0; i < totalMonths; i++) {
                const y = d.getFullYear(), m = d.getMonth() + 1;
                result.push({ year: y, month: m, key: monthKeyFn(y, m), label: monthLabel(y, m) });
                d.setMonth(d.getMonth() + 1);
            }
            return result;
        }

        function getAssocMonthIndex(assoc, mKey) {
            return assoc.months.findIndex(m => m.key === mKey);
        }

        // ============ PAYMENT CALCULATIONS ============

        // إجمالي ما دفعه العضو في شهر معين
        function getMemberTotalPaidForMonth(member, mKey) {
            if (!member.payments || !Array.isArray(member.payments)) return 0;
            return member.payments
                .filter(p => p.month === mKey && p.paid)
                .reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
        }

        // حالة الدفع للعضو في شهر
        function getMemberPaymentStatus(member, mKey, requiredAmount) {
            const paid = getMemberTotalPaidForMonth(member, mKey);
            if (paid >= requiredAmount && requiredAmount > 0) return 'full';
            if (paid > 0) return 'partial';
            return 'none';
        }

        // المتبقي على العضو في شهر
        function getMemberRemainingForMonth(member, mKey, requiredAmount) {
            const paid = getMemberTotalPaidForMonth(member, mKey);
            return Math.max(requiredAmount - paid, 0);
        }

        // ==============================================

        function getAssocTotalCollected(assoc, mKey) {
            let total = 0;
            assoc.members.forEach(m => {
                total += getMemberTotalPaidForMonth(m, mKey);
            });
            return total;
        }

        function getAssocMembersFullPaidCount(assoc, mKey) {
            let count = 0;
            assoc.members.forEach(m => {
                if (getMemberPaymentStatus(m, mKey, assoc.monthlyPayment) === 'full') count++;
            });
            return count;
        }

        function getAssocMembersPartialPaidCount(assoc, mKey) {
            let count = 0;
            assoc.members.forEach(m => {
                if (getMemberPaymentStatus(m, mKey, assoc.monthlyPayment) === 'partial') count++;
            });
            return count;
        }

        function getAssocMembersUnpaidCount(assoc, mKey) {
            let count = 0;
            assoc.members.forEach(m => {
                if (getMemberPaymentStatus(m, mKey, assoc.monthlyPayment) === 'none') count++;
            });
            return count;
        }

        function getAssocMonthProgress(assoc, idx) {
            const month = assoc.months[idx];
            if (!month) return { paid: 0, total: 0, percent: 0, allPaid: false };
            const totalRequired = assoc.members.length * assoc.monthlyPayment;
            const paid = getAssocTotalCollected(assoc, month.key);
            const percent = totalRequired > 0 ? Math.round((paid / totalRequired) * 100) : 0;
            const allPaid = paid >= totalRequired && totalRequired > 0;
            return { paid, total: totalRequired, percent, allPaid };
        }

        function getCollectionOrder(assoc) {
            if (assoc.collectionOrder && assoc.collectionOrder.length === assoc.members.length) {
                return assoc.collectionOrder;
            }
            return assoc.members.map(m => m.id);
        }

        function getCurrentCollector(assoc) {
            const order = getCollectionOrder(assoc);
            const closedMonths = assoc.months.filter(m => m.status === 'closed' || m.status === 'completed').length;
            let idx = closedMonths % order.length;
            if (idx >= order.length) idx = 0;
            const memberId = order[idx];
            return assoc.members.find(m => m.id === memberId) || null;
        }

        function getAssocStatus(assoc) {
            if (assoc.status === 'paused') return 'paused';
            const allDone = assoc.months.every(m => m.status === 'closed' || m.status === 'completed');
            if (allDone && assoc.months.length > 0) return 'completed';
            return 'active';
        }

        // ======================================================================
        //  NOTIFICATIONS
        // ======================================================================
        function addNotification(type, message) {
            data.notifications.unshift({ id: genId(), type, message, read: false, date: new Date().toISOString() });
            if (data.notifications.length > 100) data.notifications = data.notifications.slice(0, 100);
            saveData();
            renderNotificationsBadge();
        }

        function renderNotificationsBadge() {
            const unread = data.notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notifBadge');
            if (unread > 0) {
                badge.style.display = 'flex';
                badge.textContent = unread > 9 ? '9+' : unread;
            } else {
                badge.style.display = 'none';
            }
        }

        function markAllNotificationsRead() {
            data.notifications.forEach(n => n.read = true);
            saveData();
            renderNotificationsBadge();
            renderNotificationsPage();
        }

        function clearAllNotifications() {
            data.notifications = [];
            saveData();
            renderNotificationsBadge();
            renderNotificationsPage();
        }

        // ======================================================================
        //  TOAST
        // ======================================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = { success: 'fas fa-check-circle', error: 'fas fa-exclamation-circle', warning: 'fas fa-triangle-exclamation', info: 'fas fa-info-circle' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="${icons[type] || icons.info}"></i>
                <span class="toast-msg">${message}</span>
                <span class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></span>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 5000);
        }

        // ======================================================================
        //  MODALS & CONFIRM
        // ======================================================================
        function openModal(id) { document.getElementById(id).classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); document.body.style.overflow = ''; }

        function confirmAction(message, callback) {
            document.getElementById('confirmMessage').textContent = message;
            const btn = document.getElementById('confirmBtn');
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener('click', function() { closeModal('confirmModal'); callback(); });
            openModal('confirmModal');
        }

        // ======================================================================
        //  NAVIGATION & THEME
        // ======================================================================
        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page-' + page);
            if (target) target.classList.add('active');
            if (page === 'dashboard') renderDashboard();
            else if (page === 'reports') renderReports();
            else if (page === 'settings') renderSettings();
            else if (page === 'notifications') renderNotificationsPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() {
            data.settings.darkMode = !data.settings.darkMode;
            saveData();
            applyTheme();
        }

        function applyTheme() {
            if (data.settings.darkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeIcon').className = 'fas fa-moon';
            }
        }

        // ======================================================================
        //  RENDER DASHBOARD
        // ======================================================================
        function renderDashboard() {
            const assocs = data.associations;
            const totalAssocs = assocs.filter(a => getAssocStatus(a) === 'active').length;
            const totalMembers = assocs.reduce((sum, a) => sum + a.members.length, 0);
            const now = getCurrentMonth();
            const mKeyNow = monthKeyFn(now.year, now.month);

            let totalRequired = 0, totalCollected = 0, totalFullPaid = 0, totalPartialPaid = 0, totalUnpaid = 0;
            let collectorName = '—';

            assocs.forEach(a => {
                const idx = getAssocMonthIndex(a, mKeyNow);
                if (idx >= 0) {
                    const month = a.months[idx];
                    if (month && month.status !== 'closed') {
                        totalRequired += a.members.length * a.monthlyPayment;
                        totalCollected += getAssocTotalCollected(a, month.key);
                        totalFullPaid += getAssocMembersFullPaidCount(a, month.key);
                        totalPartialPaid += getAssocMembersPartialPaidCount(a, month.key);
                        totalUnpaid += getAssocMembersUnpaidCount(a, month.key);
                    }
                }
                const collector = getCurrentCollector(a);
                if (collector) collectorName = collector.name;
            });

            const remaining = Math.max(totalRequired - totalCollected, 0);
            const stats = [
                { icon: 'fas fa-building', color: 'blue', number: totalAssocs, label: 'الجمعيات النشطة' },
                { icon: 'fas fa-user', color: 'green', number: totalMembers, label: 'إجمالي الأعضاء' },
                { icon: 'fas fa-coins', color: 'yellow', number: formatCurrency(totalRequired), label: 'المطلوب هذا الشهر' },
                { icon: 'fas fa-hand-holding-usd', color: 'green', number: formatCurrency(totalCollected), label: 'تم التحصيل' },
                { icon: 'fas fa-clock', color: 'orange', number: formatCurrency(remaining), label: 'المتبقي للتحصيل' },
                { icon: 'fas fa-check-circle', color: 'green', number: totalFullPaid, label: 'دفعوا كامل' },
                { icon: 'fas fa-adjust', color: 'yellow', number: totalPartialPaid, label: 'دفعوا جزئي' },
                { icon: 'fas fa-times-circle', color: 'red', number: totalUnpaid, label: 'لم يدفعوا' },
                { icon: 'fas fa-crown', color: 'blue', number: collectorName, label: 'مستحق القبض هذا الشهر' }
            ];

            const grid = document.getElementById('statsGrid');
            grid.innerHTML = stats.map(s => `
                <div class="stat-card">
                    <div class="stat-icon ${s.color}"><i class="${s.icon}"></i></div>
                    <div class="stat-info">
                        <div class="number">${s.number}</div>
                        <div class="label">${s.label}</div>
                    </div>
                </div>
            `).join('');

            const alerts = [];
            if (totalUnpaid > 0) alerts.push(`🔴 ${totalUnpaid} عضو لم يدفعوا`);
            if (totalPartialPaid > 0) alerts.push(`🟠 ${totalPartialPaid} عضو دفعوا جزئياً`);
            if (remaining > 0) alerts.push(`💰 متبقي ${formatCurrency(remaining)}`);
            if (totalAssocs === 0) alerts.push('📌 لا توجد جمعيات نشطة');
            if (alerts.length === 0) alerts.push('✅ كل شيء على ما يرام');
            document.getElementById('quickSummary').textContent = alerts.join(' | ');

            renderCollectionQueue();
            renderAssociations();
            renderNotificationsBadge();
        }

        function renderCollectionQueue() {
            const container = document.getElementById('collectionQueue');
            const assocs = data.associations.filter(a => getAssocStatus(a) === 'active');
            if (assocs.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-trophy"></i><h3>لا توجد جمعيات نشطة</h3></div>';
                return;
            }
            let html = '';
            assocs.forEach(a => {
                const collector = getCurrentCollector(a);
                const order = getCollectionOrder(a);
                if (collector) {
                    const idx = order.indexOf(collector.id);
                    html += `
                        <div style="margin-bottom:12px;background:var(--gray-light);border-radius:var(--radius-sm);padding:12px 16px;">
                            <div style="font-weight:600;color:var(--primary);font-size:0.9rem;">${a.name}</div>
                            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">
                                ${order.map((mid, i) => {
                                    const m = a.members.find(mm => mm.id === mid);
                                    if (!m) return '';
                                    const isActive = i === idx;
                                    const isDone = i < idx;
                                    const cls = isActive ? 'badge-success' : (isDone ? 'badge-gray' : 'badge-info');
                                    const icon = isActive ? '⭐' : (isDone ? '✅' : '⏳');
                                    return `<span class="badge ${cls}">${i+1}. ${m.name} ${icon}</span>`;
                                }).join('')}
                            </div>

        // ======================================================================
        //  ASSOCIATION CRUD
        // ======================================================================
        function openAddAssociation() {
            document.getElementById('assocModalTitle').textContent = 'جمعية جديدة';
            document.getElementById('editAssocId').value = '';
            document.getElementById('assocForm').reset();
            document.getElementById('assocEnd').value = '';
            document.getElementById('assocMonthly').value = '';
            document.getElementById('membersNamesGroup').style.display = 'none';
            document.getElementById('membersNamesContainer').innerHTML = '';
            document.getElementById('assocNotes').value = '';
            const today = todayStr();
            document.getElementById('assocStart').value = today;
            document.getElementById('assocMonths').value = '';
            document.getElementById('assocEnd').readOnly = true;

            document.getElementById('assocTotal').oninput = updateFromTotal;
            document.getElementById('assocMonthly').oninput = updateFromMonthly;
            document.getElementById('assocMembersCount').oninput = updateFromTotal;
            document.getElementById('assocStart').onchange = calcEndFromStart;
            document.getElementById('assocMonths').oninput = calcEndFromStart;

            updateFromTotal();
            calcEndFromStart();
            openModal('assocModal');
        }

        function updateFromTotal() {
            const total = parseFloat(document.getElementById('assocTotal').value) || 0;
            const members = parseInt(document.getElementById('assocMembersCount').value) || 1;
            const months = parseInt(document.getElementById('assocMonths').value) || 1;
            const monthly = members > 0 && months > 0 ? Math.round(total / months / members) : 0;
            document.getElementById('assocMonthly').value = monthly > 0 ? monthly : '';
            generateMemberInputs();
        }

        function updateFromMonthly() {
            const monthly = parseFloat(document.getElementById('assocMonthly').value) || 0;
            const members = parseInt(document.getElementById('assocMembersCount').value) || 1;
            const months = parseInt(document.getElementById('assocMonths').value) || 1;
            const total = monthly * members * months;
            document.getElementById('assocTotal').value = total > 0 ? total : '';
            generateMemberInputs();
        }

        function generateMemberInputs() {
            const count = parseInt(document.getElementById('assocMembersCount').value) || 0;
            const container = document.getElementById('membersNamesContainer');
            const group = document.getElementById('membersNamesGroup');
            if (count > 0) {
                group.style.display = 'block';
                let html = '';
                const existingInputs = container.querySelectorAll('.member-name-input');
                for (let i = 0; i < count; i++) {
                    const val = existingInputs[i] ? existingInputs[i].value : '';
                    html += `
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                            <span style="font-weight:600;font-size:0.85rem;min-width:30px;">${i+1}.</span>
                            <input type="text" class="member-name-input" placeholder="اسم العضو ${i+1}" value="${val}" required />
                        </div>
                    `;
                }
                container.innerHTML = html;
            } else {
                group.style.display = 'none';
                container.innerHTML = '';
            }
        }

        function calcEndFromStart() {
            const start = document.getElementById('assocStart').value;
            const months = parseInt(document.getElementById('assocMonths').value) || 1;
            if (start && months > 0) {
                document.getElementById('assocEnd').value = addMonths(start, months - 1);
            } else {
                document.getElementById('assocEnd').value = '';
            }
        }

        function saveAssociation(e) {
            e.preventDefault();
            const name = document.getElementById('assocName').value.trim();
            const totalValue = parseFloat(document.getElementById('assocTotal').value);
            const membersCount = parseInt(document.getElementById('assocMembersCount').value);
            const startDate = document.getElementById('assocStart').value;
            const months = parseInt(document.getElementById('assocMonths').value);
            const monthlyPayment = parseFloat(document.getElementById('assocMonthly').value) || 0;
            const notes = document.getElementById('assocNotes').value.trim();
            const editId = document.getElementById('editAssocId').value;

            if (!name) { showToast('يرجى إدخال اسم الجمعية', 'error'); return; }
            if (!totalValue || totalValue <= 0) { showToast('يرجى إدخال قيمة الجمعية الإجمالية', 'error'); return; }
            if (!membersCount || membersCount < 1) { showToast('يرجى إدخال عدد الأعضاء', 'error'); return; }
            if (!startDate) { showToast('يرجى اختيار تاريخ البداية', 'error'); return; }
            if (months < 1) { showToast('عدد الأشهر يجب أن يكون أكبر من صفر', 'error'); return; }
            if (monthlyPayment <= 0) { showToast('يرجى إدخال قيمة دفع شهرية صحيحة', 'error'); return; }

            const endDate = addMonths(startDate, months - 1);
            const nameInputs = document.querySelectorAll('.member-name-input');
            const memberNames = [];
            nameInputs.forEach(inp => { const val = inp.value.trim(); if (val) memberNames.push(val); });
            if (memberNames.length !== membersCount) {
                showToast('يرجى إدخال أسماء جميع الأعضاء', 'error');
                return;
            }

            if (editId) {
                const assoc = data.associations.find(a => a.id === parseInt(editId));
                if (assoc) {
                    const oldMembers = assoc.members;
                    const newMembers = memberNames.map((name, i) => {
                        const old = oldMembers[i] || null;
                        return {
                            id: old ? old.id : genId(),
                            name: name,
                            payments: old && Array.isArray(old.payments) ? old.payments : [],
                            notes: old ? old.notes : ''
                        };
                    });
                    assoc.name = name;
                    assoc.totalValue = totalValue;
                    assoc.startDate = startDate;
                    assoc.endDate = endDate;
                    assoc.totalMonths = months;
                    assoc.monthlyPayment = monthlyPayment;
                    assoc.members = newMembers;
                    const monthSeq = getMonthSequence(startDate, months);
                    assoc.months = monthSeq.map(m => {
                        const existing = assoc.months.find(mm => mm.key === m.key);
                        return { key: m.key, label: m.label, year: m.year, month: m.month, status: existing ? existing.status : 'pending' };
                    });
                    assoc.notes = notes;
                    if (!assoc.collectionOrder || assoc.collectionOrder.length !== newMembers.length) {
                        assoc.collectionOrder = newMembers.map(m => m.id);
                    }
                    saveData();
                    showToast('تم تحديث الجمعية بنجاح', 'success');
                    closeModal('assocModal');
                    renderDashboard();
                }
            } else {
                const members = memberNames.map(name => ({ id: genId(), name, payments: [], notes: '' }));
                const monthSeq = getMonthSequence(startDate, months);
                const association = {
                    id: genId(),
                    name, totalValue, startDate, endDate,
                    totalMonths: months, monthlyPayment, members,
                    months: monthSeq.map(m => ({ ...m, status: 'pending' })),
                    collectionOrder: members.map(m => m.id),
                    status: 'active', notes,
                    createdAt: new Date().toISOString()
                };
                data.associations.push(association);
                saveData();
                showToast('تم إنشاء الجمعية بنجاح', 'success');
                closeModal('assocModal');
                renderDashboard();
                addNotification('success', `تم إنشاء جمعية "${name}" بنجاح`);
            }
        }

        function editAssociation(id) {
            const assoc = data.associations.find(a => a.id === id);
            if (!assoc) { showToast('الجمعية غير موجودة', 'error'); return; }
            document.getElementById('assocModalTitle').textContent = 'تعديل الجمعية';
            document.getElementById('editAssocId').value = id;
            document.getElementById('assocName').value = assoc.name;
            document.getElementById('assocTotal').value = assoc.totalValue;
            document.getElementById('assocMonths').value = assoc.totalMonths;
            document.getElementById('assocStart').value = assoc.startDate;
            document.getElementById('assocEnd').value = assoc.endDate;
            document.getElementById('assocEnd').readOnly = true;
            document.getElementById('assocMembersCount').value = assoc.members.length;
            document.getElementById('assocMonthly').value = assoc.monthlyPayment;

            group.style.display = 'block';

            assoc.members.forEach((m, i) => {

                        <input type="text" class="member-name-input" placeholder="اسم العضو ${i+1}" value="${m.name}" required />
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('assocTotal').oninput = updateFromTotal;
            document.getElementById('assocMonthly').oninput = updateFromMonthly;

            document.getElementById('assocStart').onchange = calcEndFromStart;

        function deleteAssociation(id) {
            const assoc = data.associations.find(a => a.id === id);
            if (!assoc) return;
            confirmAction(`هل أنت متأكد من حذف جمعية "${assoc.name}"؟ سيتم حذف جميع بياناتها ومدفوعاتها.`, () => {
                data.associations = data.associations.filter(a => a.id !== id);
                saveData();

        function addMemberToAssoc(e) {
            e.preventDefault();
            const assocId = parseInt(document.getElementById('addMemberAssocId').value);
            const name = document.getElementById('addMemberName').value.trim();
            if (!name) { showToast('يرجى إدخال اسم العضو', 'error'); return; }
            const assoc = data.associations.find(a => a.id === assocId);
            if (!assoc) { showToast('الجمعية غير موجودة', 'error'); return; }
            if (assoc.members.some(m => m.name === name)) {
                showToast('هذا الاسم موجود بالفعل', 'warning');
                return;
            }
            const newMember = { id: genId(), name, payments: [], notes: '' };
            assoc.members.push(newMember);
            if (!assoc.collectionOrder) assoc.collectionOrder = [];
            assoc.collectionOrder.push(newMember.id);
            assoc.totalValue = assoc.monthlyPayment * assoc.members.length * assoc.totalMonths;
            assoc.months.forEach(m => { if (m.status !== 'closed' && m.status !== 'completed') m.status = 'pending'; });
            saveData();
            showToast(`تم إضافة العضو "${name}" بنجاح`, 'success');
            closeModal('addMemberModal');
            renderAssociationDetail(assoc);
            renderDashboard();
        }

        // ======================================================================
        //  PAYMENT SYSTEM (مُصلح)
        // ======================================================================
        function openPaymentModal(assocId, memberId) {
            const assoc = data.associations.find(a => a.id === assocId);
            if (!assoc) { showToast('الجمعية غير موجودة', 'error'); return; }
            const member = assoc.members.find(m => m.id === memberId);
            if (!member) { showToast('العضو غير موجود', 'error'); return; }

            // تأكد أن payments مصفوفة
            if (!Array.isArray(member.payments)) member.payments = [];

            document.getElementById('payAssocId').value = assocId;
            document.getElementById('payMemberId').value = memberId;
            document.getElementById('payMemberName').value = member.name;

            // بناء قائمة الأشهر
            const select = document.getElementById('payMonthSelect');
            select.innerHTML = '';
            const now = getCurrentMonth();
            const currentKey = monthKeyFn(now.year, now.month);

            // نحاول اختيار الشهر الحالي إن وُجد، وإلا أول شهر غير مكتمل
            let selectedKey = currentKey;
            if (!assoc.months.some(m => m.key === currentKey)) {
                // ابحث عن أول شهر غير مكتمل
                const firstUnpaid = assoc.months.find(m => m.status !== 'closed' && m.status !== 'completed');
                selectedKey = firstUnpaid ? firstUnpaid.key : (assoc.months[0] ? assoc.months[0].key : '');
            }

            assoc.months.forEach((m) => {
                const opt = document.createElement('option');
                opt.value = m.key;
                opt.textContent = m.label + (m.status === 'closed' ? ' (مغلق)' : (m.status === 'completed' ? ' (مكتمل)' : ''));
                if (m.key === selectedKey) opt.selected = true;
                select.appendChild(opt);
            });

            // ربط حدث التغيير
            select.onchange = function() { updatePaymentHint(assoc, member); };

            // تحديث التلميح والمبلغ
            updatePaymentHint(assoc, member);

            document.getElementById('payMethod').value = '';
            document.getElementById('payNote').value = '';
            openModal('paymentModal');
        }

        function updatePaymentHint(assoc, member) {
            const select = document.getElementById('payMonthSelect');
            const mKey = select.value;
            if (!mKey) return;
            const paid = getMemberTotalPaidForMonth(member, mKey);
            const required = assoc.monthlyPayment;
            const remaining = Math.max(required - paid, 0);

            const hint = document.getElementById('payRemainingHint');
            if (remaining <= 0) {
                hint.innerHTML = `✅ هذا الشهر مكتمل بالفعل.<br>المطلوب: ${formatCurrency(required)} | المدفوع: ${formatCurrency(paid)}<br>يمكنك تسجيل دفعة إضافية (ستُحسب كرصيد للعضو).`;
            } else {
                hint.innerHTML = `المطلوب: <strong>${formatCurrency(required)}</strong> | المدفوع: <strong style="color:var(--success);">${formatCurrency(paid)}</strong> | المتبقي: <strong style="color:var(--danger);">${formatCurrency(remaining)}</strong>`;
            }

            const amountInput = document.getElementById('payAmount');
            amountInput.value = remaining > 0 ? remaining : '';
            amountInput.placeholder = remaining > 0 ? `المتبقي ${formatCurrency(remaining)}` : 'أدخل أي مبلغ (دفعة إضافية)';
        }

        function openAddPaymentForAssoc(assocId) {
            const assoc = data.associations.find(a => a.id === assocId);
            if (!assoc) return;
            if (assoc.members.length === 0) { showToast('لا يوجد أعضاء', 'error'); return; }
            const now = getCurrentMonth();
            const mk = monthKeyFn(now.year, now.month);
            let member = null;
            if (assoc.months.some(m => m.key === mk)) {
                const unpaid = assoc.members.find(m => {
                    const paid = getMemberTotalPaidForMonth(m, mk);
                    return paid < assoc.monthlyPayment;
                });
                if (unpaid) member = unpaid;
            }
            if (!member) member = assoc.members[0];
            openPaymentModal(assocId, member.id);
        }

        function recordPayment(e) {
            e.preventDefault();
            const assocId = parseInt(document.getElementById('payAssocId').value);
            const memberId = parseInt(document.getElementById('payMemberId').value);
            const mKey = document.getElementById('payMonthSelect').value;
            const amountRaw = document.getElementById('payAmount').value;
            const amount = parseFloat(amountRaw);
            const method = document.getElementById('payMethod').value;
            const note = document.getElementById('payNote').value.trim();

            // التحقق
            if (!mKey) { showToast('يرجى اختيار الشهر', 'error'); return; }
            if (isNaN(amount) || amount <= 0) { showToast('يرجى إدخال مبلغ صحيح أكبر من صفر', 'error'); return; }
            if (!method) { showToast('يرجى اختيار طريقة الدفع', 'error'); return; }

            const assoc = data.associations.find(a => a.id === assocId);
            if (!assoc) { showToast('الجمعية غير موجودة', 'error'); return; }
            const member = assoc.members.find(m => m.id === memberId);
            if (!member) { showToast('العضو غير موجود', 'error'); return; }
            if (!Array.isArray(member.payments)) member.payments = [];

            const idx = getAssocMonthIndex(assoc, mKey);
            if (idx < 0) { showToast('الشهر غير موجود', 'error'); return; }

            // إضافة الدفعة
            const payment = {
                month: mKey,
                paid: true,
                amount: amount,
                method: method,
                date: todayStr(),
                time: new Date().toLocaleTimeString('ar-EG'),
                note: note
            };
            member.payments.push(payment);

            // تحديث حالة الشهر
            const progress = getAssocMonthProgress(assoc, idx);
            const month = assoc.months[idx];
            if (progress.allPaid) {
                month.status = 'completed';
                addNotification('success', `✅ اكتمل تحصيل شهر ${month.label} في جمعية "${assoc.name}"`);
            } else if (progress.paid > 0) {
                month.status = 'partial';
            }

            saveData();
            showToast(`تم تسجيل دفعة ${member.name} بقيمة ${formatCurrency(amount)}`, 'success');
            closeModal('paymentModal');
            renderAssociationDetail(assoc);
            renderDashboard();
        }

        // ======================================================================
        //  CLOSE MONTH
        // ======================================================================
        function closeMonth(assocId) {
            const assoc = data.associations.find(a => a.id === assocId);
            if (!assoc) return;
            const now = getCurrentMonth();
            const mk = monthKeyFn(now.year, now.month);
            const idx = getAssocMonthIndex(assoc, mk);
            if (idx < 0) { showToast('لا يوجد شهر حالي', 'error'); return; }
            const month = assoc.months[idx];
            if (month.status === 'closed' || month.status === 'completed') {
                confirmAction(`الشهر ${month.label} مغلق بالفعل. هل تريد إعادة فتحه؟`, () => {
                    month.status = 'pending';
                    const progress = getAssocMonthProgress(assoc, idx);
                    if (progress.allPaid) month.status = 'completed';
                    else if (progress.paid > 0) month.status = 'partial';
                    saveData();
                    showToast(`تم إعادة فتح شهر ${month.label}`, 'info');
                    renderAssociationDetail(assoc);
                    renderDashboard();
                });
                return;
            }
            const progress = getAssocMonthProgress(assoc, idx);
            if (!progress.allPaid) {
                confirmAction(`لم يكتمل تحصيل شهر ${month.label} (المحصل: ${formatCurrency(progress.paid)} من ${formatCurrency(progress.total)}). هل تريد إغلاق الشهر مع المتبقي؟`, () => {
                    doCloseMonth(assoc, idx);
                });
            } else {
                confirmAction(`تأكيد إغلاق شهر ${month.label}؟ سيتم حفظ البيانات والانتقال للشهر التالي.`, () => {
                    doCloseMonth(assoc, idx);
                });
            }
        }

        function doCloseMonth(assoc, idx) {
            const month = assoc.months[idx];
            month.status = 'closed';
            const collector = getCurrentCollector(assoc);
            if (collector) {
                addNotification('success', `🎯 ${collector.name} هو المستحق للقبض في جمعية "${assoc.name}"`);
            }
            saveData();
            showToast(`تم إغلاق شهر ${month.label}`, 'success');
            renderAssociationDetail(assoc);
            renderDashboard();
        }

        // ======================================================================
        //  MONTH DETAIL
        // ======================================================================
        function showMonthDetail(assocId, idx) {

            document.getElementById('monthModalTitle').textContent = `📅 ${month.label}`;
            const container = document.getElementById('monthDetailContent');
            container.innerHTML = `
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;">
                    <div style="background:var(--gray-light);padding:12px;border-radius:var(--radius-sm);text-align:center;">
                        <div style="font-size:1.2rem;font-weight:700;color:var(--success);">${fullPaid.length}</div>
                        <div style="font-size:0.8rem;color:var(--text-muted);">كامل</div>
                    </div>
                    <div style="background:var(--gray-light);padding:12px;border-radius:var(--radius-sm);text-align:center;">
                        <div style="font-size:1.2rem;font-weight:700;color:var(--warning);">${partialPaid.length}</div>
                        <div style="font-size:0.8rem;color:var(--text-muted);">جزئي</div>
                    </div>
                    <div style="background:var(--gray-light);padding:12px;border-radius:var(--radius-sm);text-align:center;">
                        <div style="font-size:1.2rem;font-weight:700;color:var(--danger);">${unpaid.length}</div>
                        <div style="font-size:0.8rem;color:var(--text-muted);">لم يدفع</div>
                    </div>
                </div>
                <div style="margin-bottom:10px;">
                    <div class="flex-between text-sm"><span>التحصيل</span><span>${formatCurrency(progress.paid)} / ${formatCurrency(progress.total)} (${progress.percent}%)</span></div>
                    <div class="progress-wrap"><div class="progress-bar ${progress.percent >= 100 ? 'green' : (progress.percent >= 60 ? 'yellow' : 'red')}" style="width:${Math.min(progress.percent,100)}%;"></div></div>
                </div>
                <div style="font-weight:600;margin-top:10px;">✅ كامل (${fullPaid.length})</div>
                ${fullPaid.map(m => `<div style="padding:4px 8px;background:var(--success-light);border-radius:var(--radius-xs);margin-bottom:4px;">${m.name} — ${formatCurrency(getMemberTotalPaidForMonth(m, month.key))}</div>`).join('') || '<div class="text-muted text-sm">لا يوجد</div>'}
                <div style="font-weight:600;margin-top:10px;">🟠 جزئي (${partialPaid.length})</div>
                ${partialPaid.map(m => `<div style="padding:4px 8px;background:var(--warning-light);border-radius:var(--radius-xs);margin-bottom:4px;">${m.name} — مدفوع: ${formatCurrency(getMemberTotalPaidForMonth(m, month.key))} / ${formatCurrency(assoc.monthlyPayment)}</div>`).join('') || '<div class="text-muted text-sm">لا يوجد</div>'}
                <div style="font-weight:600;margin-top:10px;">❌ لم يدفع (${unpaid.length})</div>
                ${unpaid.map(m => `<div style="padding:4px 8px;background:var(--danger-light);border-radius:var(--radius-xs);margin-bottom:4px;">${m.name}</div>`).join('') || '<div class="text-muted text-sm">لا يوجد</div>'}
            `;
            openModal('monthModal');
        }

        // ======================================================================
        //  MEMBER DETAIL (LEDGER)
        // ======================================================================
        function viewMemberDetail(assocId, memberId) {
            const assoc = data.associations.find(a => a.id === assocId);
            if (!assoc) return;
            const member = assoc.members.find(m => m.id === memberId);
            if (!member) return;
            if (!Array.isArray(member.payments)) member.payments = [];

            const totalPaid = member.payments.filter(p => p.paid).reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
            const totalRequired = assoc.months.length * assoc.monthlyPayment;
            const totalRemaining = Math.max(totalRequired - totalPaid, 0);
            const paidMonthsCount = assoc.months.filter(m => getMemberPaymentStatus(member, m.key, assoc.monthlyPayment) === 'full').length;

            document.getElementById('memberModalTitle').textContent = `👤 ${member.name}`;
            const container = document.getElementById('memberDetailContent');
            container.innerHTML = `
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;">
                    <div style="background:var(--success-light);padding:12px;border-radius:var(--radius-sm);text-align:center;">
                        <div style="font-size:1.1rem;font-weight:700;color:var(--success);">${formatCurrency(totalPaid)}</div>
                        <div style="font-size:0.75rem;color:var(--text-muted);">إجمالي المدفوع</div>
                    </div>
                    <div style="background:var(--danger-light);padding:12px;border-radius:var(--radius-sm);text-align:center;">
                        <div style="font-size:1.1rem;font-weight:700;color:var(--danger);">${formatCurrency(totalRemaining)}</div>
                        <div style="font-size:0.75rem;color:var(--text-muted);">إجمالي المتبقي</div>
                    </div>
                    <div style="background:var(--primary-light);padding:12px;border-radius:var(--radius-sm);text-align:center;">
                        <div style="font-size:1.1rem;font-weight:700;color:var(--primary);">${paidMonthsCount}/${assoc.months.length}</div>
                        <div style="font-size:0.75rem;color:var(--text-muted);">أشهر مكتملة</div>
                    </div>
                </div>
                <div style="font-weight:600;margin-bottom:8px;">📒 دفتر الحساب (سجل لكل شهر)</div>
                <div style="border:1px solid var(--border-color);border-radius:var(--radius-sm);max-height:340px;overflow-y:auto;">
                    ${assoc.months.map(m => {
                        const paid = getMemberTotalPaidForMonth(member, m.key);
                        const required = assoc.monthlyPayment;
                        const status = getMemberPaymentStatus(member, m.key, required);
                        const statusIcon = status === 'full' ? '✅' : (status === 'partial' ? '🟠' : '❌');
                        const statusText = status === 'full' ? 'كامل' : (status === 'partial' ? 'جزئي' : 'لم يدفع');
                        const payments = member.payments.filter(p => p.month === m.key && p.paid);
                        const details = payments.map(p => `<span class="badge badge-info" style="margin-left:4px;margin-top:4px;">${formatCurrency(p.amount)} - ${p.method}</span>`).join('');
                        return `
                            <div class="ledger-row">
                                <div style="flex:1;min-width:150px;">
                                    <div style="font-weight:600;">${statusIcon} ${m.label} <span class="badge ${status === 'full' ? 'badge-success' : (status === 'partial' ? 'badge-warning' : 'badge-danger')}" style="margin-right:6px;">${statusText}</span></div>
                                    <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">مدفوع: ${formatCurrency(paid)} / ${formatCurrency(required)}${status !== 'full' ? ` | متبقي: ${formatCurrency(required - paid)}` : ''}</div>
                                    ${details ? `<div style="margin-top:4px;">${details}</div>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                ${member.notes ? `<div style="margin-top:8px;font-size:0.9rem;color:var(--text-secondary);">📝 ${member.notes}</div>` : ''}
            `;
            openModal('memberModal');
        }

        // ======================================================================
        //  REPORTS
        // ======================================================================
        function renderReports() {
            const assocs = data.associations;
            const totalAssocs = assocs.length;
            const activeAssocs = assocs.filter(a => getAssocStatus(a) === 'active').length;
            const completedAssocs = assocs.filter(a => getAssocStatus(a) === 'completed').length;
            let totalMembers = 0, totalCollectedAll = 0, totalRequiredAll = 0;
            const methodCount = {};

            assocs.forEach(a => {
                totalMembers += a.members.length;
                a.members.forEach(m => {
                    if (Array.isArray(m.payments)) {
                        m.payments.filter(p => p.paid).forEach(p => {
                            totalCollectedAll += parseFloat(p.amount) || 0;
                            methodCount[p.method] = (methodCount[p.method] || 0) + 1;
                        });
                    }
                });
                a.months.forEach(m => {
                    if (m.status !== 'closed' && m.status !== 'completed') {
                        totalRequiredAll += a.members.length * a.monthlyPayment;
                    }
                });
            });

            const mostUsedMethod = Object.entries(methodCount).sort((a, b) => b[1] - a[1])[0];
            const commitment = totalRequiredAll > 0 ? Math.round((totalCollectedAll / totalRequiredAll) * 100) : 0;

            const container = document.getElementById('reportsContent');
            container.innerHTML = `
                <div class="grid-3" style="margin-bottom:16px;">
                    <div class="report-stat"><div class="num">${formatCurrency(totalCollectedAll)}</div><div class="lbl">إجمالي المحصل</div></div>
                    <div class="report-stat"><div class="num">${formatCurrency(totalRequiredAll)}</div><div class="lbl">إجمالي المتبقي</div></div>
                    <div class="report-stat"><div class="num">${totalMembers}</div><div class="lbl">إجمالي الأعضاء</div></div>
                </div>
                <div class="grid-3" style="margin-bottom:16px;">
                    <div class="report-stat"><div class="num">${commitment}%</div><div class="lbl">نسبة الالتزام</div></div>
                    <div class="report-stat"><div class="num">${mostUsedMethod ? mostUsedMethod[0] : '—'}</div><div class="lbl">أكثر طريقة دفع</div></div>
                    <div class="report-stat"><div class="num">${completedAssocs}</div><div class="lbl">جمعيات مكتملة</div></div>
                </div>
                <div class="grid-2">
                    <div class="report-stat"><div class="num">${activeAssocs}</div><div class="lbl">جمعيات نشطة</div></div>
                    <div class="report-stat"><div class="num">${totalAssocs}</div><div class="lbl">إجمالي الجمعيات</div></div>
                </div>
                <div style="margin-top:16px;background:var(--gray-light);padding:16px;border-radius:var(--radius-sm);">
                    <div style="font-weight:600;margin-bottom:8px;">📊 توزيع طرق الدفع</div>
                    ${Object.entries(methodCount).map(([method, count]) => `
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                            <span style="min-width:100px;">${method}</span>
                            <div style="flex:1;background:var(--bg-card);border-radius:999px;height:6px;overflow:hidden;">
                                <div style="height:100%;background:var(--primary);width:${Math.min((count / Math.max(totalCollectedAll, 1)) * 100, 100)}%;"></div>
                            </div>
                            <span class="text-sm text-muted">${count}</span>
                        </div>
                    `).join('') || '<div class="text-muted">لا توجد بيانات</div>'}
                </div>
            `;
        }

        // ======================================================================
        //  NOTIFICATIONS PAGE
        // ======================================================================
        function renderNotificationsPage() {
            const container = document.getElementById('notificationsList');
            const notifs = data.notifications;
            if (notifs.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-bell-slash"></i><h3>لا توجد إشعارات</h3></div>';
                return;
            }
            container.innerHTML = `
                <div class="flex-between mb-2">
                    <span class="text-sm text-muted">${notifs.length} إشعار</span>
                    <div class="flex gap-1">
                        <button class="btn btn-sm btn-ghost" onclick="markAllNotificationsRead()">تحديد الكل كمقروء</button>
                        <button class="btn btn-sm btn-danger" onclick="clearAllNotifications()">مسح الكل</button>
                    </div>
                </div>
                ${notifs.map(n => `
                    <div style="padding:10px 14px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:10px;${n.read ? 'opacity:0.6;' : ''}">
                        <span class="badge ${n.type === 'success' ? 'badge-success' : (n.type === 'warning' ? 'badge-warning' : (n.type === 'danger' ? 'badge-danger' : 'badge-info'))}">${n.type}</span>
                        <span style="flex:1;">${n.message}</span>
                        <span class="text-xs text-muted">${new Date(n.date).toLocaleDateString('ar-EG')}</span>
                        ${!n.read ? `<button class="btn btn-sm btn-ghost" onclick="markNotificationRead(${n.id})"><i class="fas fa-check"></i></button>` : ''}
                    </div>

            `;
            renderNotificationsBadge();
        }

        function markNotificationRead(id) {
            const n = data.notifications.find(not => not.id === id);
            if (n) { n.read = true; saveData(); renderNotificationsPage(); renderNotificationsBadge(); }
        }

        function toggleNotifications() { navigateTo('notifications'); }

        // ======================================================================
        //  SETTINGS
        // ======================================================================
        function renderSettings() {
            const s = data.settings;
            const container = document.getElementById('settingsContent');
            container.innerHTML = `
                <div style="margin-bottom:20px;">
                    <h3 style="margin-bottom:12px;">⚙️ إعدادات التطبيق</h3>
                    <div class="setting-item">
                        <div class="left"><i class="fas fa-pencil-alt"></i> اسم التطبيق</div>

                    </div>
                    <div class="setting-item">
                        <div class="left"><i class="fas fa-money-bill"></i> العملة الافتراضية</div>

                    </div>
                    <div class="setting-item">
                        <div class="left"><i class="fas fa-moon"></i> الوضع الليلي</div>

                        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)" />
                        <button class="btn btn-danger" onclick="clearAllData()"><i class="fas fa-trash"></i> مسح البيانات</button>

                <button class="btn btn-outline" onclick="navigateTo('dashboard')">العودة للرئيسية</button>

                data.settings.appName = this.value || 'جمعيتي';
                saveData();
                document.querySelector('.navbar-brand span').textContent = data.settings.appName;
                showToast('تم تحديث اسم التطبيق', 'success');
            };
            document.getElementById('settingsCurrency').onchange = function() {
                data.settings.currency = this.value || 'جنيه مصري';
                saveData();
                showToast('تم تحديث العملة', 'success');
                renderDashboard();
            };
